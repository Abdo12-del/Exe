[mysqld]
# ===================================================================
# SalesManagement PRO - Embedded Portable MySQL Configuration
# Optimized for Desktop POS / Retail (Low Memory, High Speed)
# ===================================================================

# Port 3307 to avoid any conflict with existing MySQL/XAMPP on 3306
port = 3307
bind-address = 0.0.0.0
mysqlx = 0

# Character Set
character-set-server = utf8mb4
collation-server = utf8mb4_unicode_ci

# Storage Engine
default-storage-engine = InnoDB
default_authentication_plugin = mysql_native_password

# Memory & Performance Tuning for Desktop POS
innodb_buffer_pool_size = 64M
innodb_log_file_size = 16M
innodb_flush_log_at_trx_commit = 2
innodb_file_per_table = 1
max_connections = 50
table_open_cache = 200

# Networking & Timeouts
skip-name-resolve
max_allowed_packet = 64M
interactive_timeout = 28800
wait_timeout = 28800

# Logging
log_error_verbosity = 2

[client]
port = 3307
default-character-set = utf8mb4

[mysql]
default-character-set = utf8mb4
